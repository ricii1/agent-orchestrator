# Only loopback destinations select this vhost; existing LAN sites stay separate.
<VirtualHost 127.0.0.1:80>
    ServerName kantor.test
    ProxyRequests Off
    ProxyPreserveHost Off
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^kantor\.test$ [NC]
    RewriteRule ^ - [F,L]
    RewriteCond %{HTTP:Origin} !^$
    RewriteCond %{HTTP:Origin} !^http://kantor\.test$
    RewriteRule ^ - [F,L]
    # The backend still validates its exact original host and origin.
    RequestHeader edit Origin "^http://kantor\.test$" "http://127.0.0.1:4317"
    <Location />
        Require ip 127.0.0.1
    </Location>
    ProxyPass / http://127.0.0.1:4317/ connectiontimeout=3 timeout=60 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:4317/
</VirtualHost>
